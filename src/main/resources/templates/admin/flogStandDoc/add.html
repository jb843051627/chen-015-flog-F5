<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('编制单位底档 · 立户')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox"><div class="main-container">
        <div class="layui-form-item">
            <label class="layui-form-label">单位全称</label>
            <div class="layui-input-block">
                <input type="text" name="siteName" autocomplete="off" placeholder="一档只管一家，名号重复立不了第二户" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">经营类别</label>
            <div class="layui-input-inline">
                <select name="siteType" lay-filter="siteType">
                    <option value="">请选择</option>
                    <option value="国有林场">国有林场</option>
                    <option value="集体林场">集体林场</option>
                    <option value="个人承包山">个人承包山</option>
                </select>
            </div>
            <div class="layui-form-mid layui-word-aux">字号按类别各排各的：国有 GL / 集体 JT / 个人 GR，系统自动给</div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">管辖林业站</label>
            <div class="layui-input-block">
                <input type="text" name="roadName" autocomplete="off" placeholder="一路写到 省—市—县" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">轻度线上限</label>
            <div class="layui-input-inline">
                <input type="number" step="0.01" name="th1Max" class="layui-input" placeholder="立方米">
            </div>
            <label class="layui-form-label">中度线上限</label>
            <div class="layui-input-inline">
                <input type="number" step="0.01" name="th2Max" class="layui-input" placeholder="立方米；等于此线落重度">
            </div>
            <label class="layui-form-label">重度线上限</label>
            <div class="layui-input-inline">
                <input type="number" step="0.01" name="th3Max" class="layui-input" placeholder="立方米；越过亦算重度">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block"><textarea name="remark" class="layui-textarea"></textarea></div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block layui-word-aux">字号由系统自动生成，本页不设字号栏；三条线为该家单张卡拟采蓄积的轻、中、重档界。</div>
        </div>
    </div></div>
    <div class="bottom"><div class="button-container">
        <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="doc-save">
            <i class="layui-icon layui-icon-ok"></i> 提交立户
        </button>
        <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">重置</button>
    </div></div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery', 'layer'], function () {
        let form = layui.form, $ = layui.jquery, layer = layui.layer;
        form.on('submit(doc-save)', function (data) {
            let loading = layer.load();
            $.ajax({url: rootPath + '/FlogStandDocController/add', data: data.field, type: 'post', dataType: 'json',
                success: function (r) {
                    layer.close(loading);
                    if (r.code === 200) {
                        layer.msg(r.msg, {icon: 1, time: 1400}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            if (parent.layui && parent.layui.table) { parent.layui.table.reload('doc-table'); }
                        });
                    } else { layer.msg(r.msg || '立户失败', {icon: 2, time: 3000}); }
                },
                error: function () { layer.close(loading); layer.msg('请求失败', {icon: 2}); }});
            return false;
        });
    });
</script>
</body>
</html>
