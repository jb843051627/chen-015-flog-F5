<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('建档卡旧版翻检')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-header">
        建档卡号：<b th:text="${billNo}"></b>　<span class="layui-word-aux">各版本只供事后翻检，摆出来的现行只许最新一版，旧版覆不掉</span>
    </div>
    <div class="layui-card-body">
        <table class="layui-table">
            <thead>
            <tr>
                <th>版次</th>
                <th>现行</th>
                <th>采伐方式</th>
                <th>拟采蓄积(m³)</th>
                <th>顺位</th>
                <th>进展</th>
                <th>核验串</th>
                <th>立卡人</th>
                <th>立卡时刻</th>
                <th>录单人</th>
                <th>录入时间</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="v : ${versions}">
                <td th:text="${v.nodeNo}"></td>
                <td>
                    <span th:if="${v.currentFlag == 1}" class="layui-badge layui-bg-green">现行</span>
                    <span th:unless="${v.currentFlag == 1}" class="layui-badge">旧版</span>
                </td>
                <td>
                    <span th:switch="${v.cutMode}">
                        <span th:case="1">皆伐</span>
                        <span th:case="2">渐伐</span>
                        <span th:case="3">择伐</span>
                        <span th:case="4">抚育采伐</span>
                        <span th:case="5">更新采伐</span>
                        <span th:case="6">低质低效林改造</span>
                    </span>
                </td>
                <td th:text="${v.qty}"></td>
                <td>
                    <span th:switch="${v.gradeLevel}">
                        <span th:case="1">轻度</span>
                        <span th:case="2">中度</span>
                        <span th:case="3">重度</span>
                    </span>
                </td>
                <td>
                    <span th:switch="${v.status}">
                        <span th:case="0">待核对</span>
                        <span th:case="1">已核对</span>
                        <span th:case="2">已压死</span>
                    </span>
                </td>
                <td th:text="${v.content}"></td>
                <td th:text="${v.registerBy}"></td>
                <td th:text="${#dates.format(v.registerTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
                <td th:text="${v.createBy}"></td>
                <td th:text="${v.createTime != null ? #dates.format(v.createTime, 'yyyy-MM-dd HH:mm:ss') : ''}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<th:block th:include="include :: footer"/>
</body>
</html>
