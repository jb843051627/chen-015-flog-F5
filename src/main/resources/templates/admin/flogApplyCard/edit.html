<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('伐区采伐申请建档卡 · 重录')"/>
</head>
<body>
<form class="layui-form" th:object="${card}">
    <input type="hidden" name="reviseId" th:value="*{id}">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">原卡号/版次</label>
                <div class="layui-input-inline" style="padding-top:9px;">
                    <span th:text="*{billNo}"></span>　第 <span th:text="*{nodeNo}"></span> 版 → 提交即升第
                    <span th:text="*{nodeNo} + 1"></span> 版
                </div>
                <label class="layui-form-label">立卡人</label>
                <div class="layui-input-inline" style="padding-top:9px;">
                    <span th:text="*{registerBy}"></span>
                    <span class="layui-word-aux">（钉住不挪，办理人另记流水）</span>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">所属底档</label>
                <div class="layui-input-block">
                    <select name="siteId" lay-filter="siteId" lay-search="">
                        <option th:each="d : ${standDocs}" th:value="${d.id}"
                                th:attr="selected=${d.id.longValue() == card.siteId.longValue()}"
                                th:text="${d.siteNo} + '｜' + ${d.siteName} + '（' + ${d.siteType} + '）'"></option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">小班号</label>
                <div class="layui-input-inline">
                    <input type="text" name="subcompNo" th:value="*{subcompNo}" class="layui-input">
                </div>
                <label class="layui-form-label">伐区名号</label>
                <div class="layui-input-inline">
                    <input type="text" name="cutBlockNo" th:value="*{cutBlockNo}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">采伐方式</label>
                <div class="layui-input-inline">
                    <select name="cutMode" lay-filter="cutMode">
                        <option value="1" th:selected="*{cutMode} == 1">主伐·皆伐</option>
                        <option value="2" th:selected="*{cutMode} == 2">主伐·渐伐</option>
                        <option value="3" th:selected="*{cutMode} == 3">主伐·择伐</option>
                        <option value="4" th:selected="*{cutMode} == 4">抚育采伐</option>
                        <option value="5" th:selected="*{cutMode} == 5">更新采伐</option>
                        <option value="6" th:selected="*{cutMode} == 6">低质低效林改造</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">拟采蓄积(m³)</label>
                <div class="layui-input-inline">
                    <input type="number" step="0.01" min="0.01" name="qty" th:value="*{qty}" class="layui-input">
                </div>
                <label class="layui-form-label">新报面积(ha)</label>
                <div class="layui-input-inline">
                    <input type="number" step="0.01" min="0" name="fineAmt" th:value="*{fineAmt}" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item mode-field" data-modes="1">
                <label class="layui-form-label">皆伐·株数</label>
                <div class="layui-input-inline">
                    <input type="number" step="1" min="1" name="clearTrees" th:value="*{clearTrees}" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">面积填上面“新报面积”</div>
            </div>
            <div class="layui-form-item mode-field" data-modes="2">
                <label class="layui-form-label">渐伐·分年次数</label>
                <div class="layui-input-inline">
                    <input type="number" step="1" min="1" name="gradYears" th:value="*{gradYears}" class="layui-input">
                </div>
                <label class="layui-form-label">间隔年数</label>
                <div class="layui-input-inline">
                    <input type="number" step="1" min="1" name="gradInterval" th:value="*{gradInterval}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item mode-field" data-modes="3">
                <label class="layui-form-label">择伐·强度(%)</label>
                <div class="layui-input-inline">
                    <input type="number" step="0.01" min="0.01" name="selectIntensity" th:value="*{selectIntensity}" class="layui-input">
                </div>
                <label class="layui-form-label">保留株数</label>
                <div class="layui-input-inline">
                    <input type="number" step="1" min="1" name="selectKeepTrees" th:value="*{selectKeepTrees}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item mode-field" data-modes="4">
                <label class="layui-form-label">抚育办法</label>
                <div class="layui-input-inline">
                    <input type="text" name="tendMethod" th:value="*{tendMethod}" class="layui-input">
                </div>
                <label class="layui-form-label">每公顷采出量</label>
                <div class="layui-input-inline">
                    <input type="number" step="0.01" min="0.01" name="tendPerHa" th:value="*{tendPerHa}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item mode-field" data-modes="5">
                <label class="layui-form-label">更新方式</label>
                <div class="layui-input-inline">
                    <input type="text" name="renewMode" th:value="*{renewMode}" class="layui-input">
                </div>
                <label class="layui-form-label">完成年度</label>
                <div class="layui-input-inline">
                    <input type="number" step="1" min="1900" name="renewFinishYear" th:value="*{renewFinishYear}" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item mode-field" data-modes="6">
                <label class="layui-form-label">目标树种</label>
                <div class="layui-input-inline">
                    <input type="text" name="reformTree" th:value="*{reformTree}" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea" th:text="*{remark}"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block layui-word-aux">
                    改版不等于删旧：本版从现行处退下另存留检；核验串日子挪到新版那天，旧版那一行留原样。系统栏不可手改。
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="card-update">
                <i class="layui-icon layui-icon-ok"></i> 提交重录
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">重置</button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script th:src="@{/static/component/flogCardForm.js}"></script>
<script>
    window.FLOG_FORM = {filterName: 'card-update', url: rootPath + '/FlogApplyCardController/edit'};
</script>
</body>
</html>
