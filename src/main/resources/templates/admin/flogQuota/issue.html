<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('年度采伐额度下达')"/>
</head>
<body class="pear-container">
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form">
            <div class="layui-form-item">
                <label class="layui-form-label">底档字号</label>
                <div class="layui-input-inline" style="width:340px;">
                    <select name="siteNo" lay-search="">
                        <option value="">请选择</option>
                        <option th:each="d : ${standDocs}" th:value="${d.siteNo}"
                                th:text="${d.siteNo} + '｜' + ${d.siteName}"></option>
                    </select>
                </div>
                <label class="layui-form-label">年度</label>
                <div class="layui-input-inline">
                    <input type="number" name="quotaYear" class="layui-input" th:value="${#dates.year(#dates.createNow())}">
                </div>
                <label class="layui-form-label">本年可占(m³)</label>
                <div class="layui-input-inline">
                    <input type="number" step="0.01" min="0" name="totalQty" class="layui-input" placeholder="年初批下的总数">
                </div>
                <button class="pear-btn pear-btn-primary pear-btn-md" lay-submit lay-filter="issue">
                    <i class="layui-icon layui-icon-ok"></i> 下达
                </button>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block layui-word-aux">
                    一家一年一本账；改批总数若低于已扣合计会被当场驳回。下达后到「建档卡 · 额度账」屏看已扣/尚存同账。
                </div>
            </div>
        </form>
    </div>
</div>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery', 'layer'], function () {
        let form = layui.form, $ = layui.jquery, layer = layui.layer;
        form.on('submit(issue)', function (data) {
            if (!data.field.siteNo) { layer.msg('请选底档字号', {icon: 3}); return false; }
            let loading = layer.load();
            $.ajax({url: rootPath + '/FlogQuotaController/issue', data: data.field, type: 'post', dataType: 'json',
                success: function (r) {
                    layer.close(loading);
                    if (r.code === 200) { layer.msg(r.msg, {icon: 1}); }
                    else { layer.msg(r.msg || '下达失败', {icon: 2, time: 3000}); }
                },
                error: function () { layer.close(loading); layer.msg('请求失败', {icon: 2}); }});
            return false;
        });
    });
</script>
</body>
</html>
