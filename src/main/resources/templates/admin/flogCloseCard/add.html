<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('伐区勾销事务卡 · 开卡报伐')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">底档字号</label>
                <div class="layui-input-inline">
                    <input type="text" name="siteNo" autocomplete="off" placeholder="如 DC00，以字号核" class="layui-input">
                </div>
                <label class="layui-form-label">小班号</label>
                <div class="layui-input-inline">
                    <input type="text" name="subcompNo" autocomplete="off" placeholder="一张卡一片小班" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">伐区名号</label>
                <div class="layui-input-inline">
                    <input type="text" name="cutBlockNo" autocomplete="off" placeholder="可空，认设计单时回填" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">设计单号</label>
                <div class="layui-input-block">
                    <input type="text" name="designNo" autocomplete="off"
                           placeholder="设计单上钉过号的那张；字号、小班必须同片，拿别片的顶不过来" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">实采株数</label>
                <div class="layui-input-inline">
                    <input type="number" step="1" min="1" name="actualTrees" autocomplete="off" placeholder="山场实际采出株数" class="layui-input">
                </div>
                <label class="layui-form-label">实采蓄积(m³)</label>
                <div class="layui-input-inline">
                    <input type="number" step="0.0001" min="0.0001" name="actualVolume" autocomplete="off" placeholder="实际采出蓄积，须为正" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">核株差格(m³)</label>
                <div class="layui-input-inline">
                    <input type="number" step="0.0001" min="0" name="diffTolerance" autocomplete="off" placeholder="空着用站里默认 10 立方米" class="layui-input">
                </div>
                <div class="layui-form-mid layui-word-aux">核株时 |实采-设计| 越过此格就得给一句说法</div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">备注</label>
                <div class="layui-input-block">
                    <textarea name="remark" class="layui-textarea"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-input-block layui-word-aux">
                    开卡与报伐是同一口，没有“先开一张空卡再就地补一句”的第二条道。
                    卡号、段次、落定一律系统给；一小班同时只许一张活卡，头一张了断或止步后才许另起。
                </div>
            </div>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="close-save">
                <i class="layui-icon layui-icon-ok"></i> 开卡并报伐
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">重置</button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form, $ = layui.jquery;
        form.on('submit(close-save)', function (data) {
            let loading = layer.load();
            $.ajax({
                url: rootPath + '/flogCloseCard/add', type: 'post', data: data.field,
                success: function (r) {
                    layer.close(loading);
                    if (r.code === 200) {
                        layer.msg((r.data && r.data.message) ? r.data.message : '开卡成功',
                            {icon: 1, time: 1600}, function () {
                                parent.layer.closeAll();
                                parent.layui.table.reload('close-table');
                            });
                    } else {
                        layer.msg(r.msg || '卡立不住', {icon: 2});
                    }
                },
                error: function () { layer.close(loading); layer.msg('请求失败', {icon: 2}); }
            });
            return false;
        });
    });
</script>
</body>
</html>
